[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hcr"
version = "0.1.0"
description = "Reproducible cleaning and quality-profiling pipeline for the UK offshore Hydrocarbon Release Database (HSE)"
readme = "README.md"
authors = [{ name = "Louis Grochla" }]
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "openpyxl",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "matplotlib",
    "scikit-learn",
]
nlp = [
    "scikit-learn",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
